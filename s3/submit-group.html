<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Submit a Group — Fourplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /* Self-hosted, same file frontend/index.html uses — see that file's
     stylesheet.css for why (one variable font backing every weight, no
     external Google Fonts dependency). Only the two weights this page
     actually renders (400 body text, 700 for h1's implicit bold — no
     explicit font-weight is set anywhere here). */
  @font-face {
    font-family: "Libre Franklin";
    src: url("assets/fonts/LibreFranklin-Variable.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Libre Franklin";
    src: url("assets/fonts/LibreFranklin-Variable.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --chosen-bg: #3a3a34;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    font-family: "Libre Franklin", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #1a1a1a;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .panel {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.7rem;
    margin: 12px 0 4px;
  }
  .tagline {
    opacity: 0.75;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .words-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  input {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
  }
  button {
    align-self: flex-start;
    background-color: var(--chosen-bg);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 4px;
  }
  button:hover {
    background-color: #52524a;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #submit-group-message {
    font-size: 0.85rem;
    opacity: 0.85;
    min-height: 1.2em;
  }
  @media (max-width: 400px) {
    .words-row {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>Submit a group</h1>
    <p class="tagline">
      Propose four words and the category connecting them — every submission is reviewed before it can appear in a
      puzzle.
    </p>
    <form id="submit-group-form" autocomplete="off">
      <div class="words-row">
        <input id="submit-word-1" type="text" placeholder="Word 1" maxlength="40" autocomplete="off" required />
        <input id="submit-word-2" type="text" placeholder="Word 2" maxlength="40" autocomplete="off" required />
        <input id="submit-word-3" type="text" placeholder="Word 3" maxlength="40" autocomplete="off" required />
        <input id="submit-word-4" type="text" placeholder="Word 4" maxlength="40" autocomplete="off" required />
      </div>
      <input id="submit-category" type="text" placeholder="Category connecting them" maxlength="200" autocomplete="off" required />
      <button type="submit">Submit group</button>
      <p id="submit-group-message"></p>
    </form>
  </div>

<script>
const API_HOST = "https://api.foursure.elliscode.com";

const submitGroupForm = document.getElementById("submit-group-form");
const submitGroupMessage = document.getElementById("submit-group-message");
const submitGroupButton = submitGroupForm.querySelector("button[type=submit]");

// Guards against duplicate submissions from a double-tap/double-click, or
// from mashing the button again while a slow connection is still waiting on
// the first response -- the button's own disabled state is the main defense,
// but isSubmitting is checked too in case a second submit event still slips
// through (e.g. hitting Enter in a text field while disabled has yet to take
// visual effect).
let isSubmitting = false;

async function submitGroupCallback(event) {
  event.preventDefault();
  if (isSubmitting) {
    return;
  }
  let words = [1, 2, 3, 4].map((n) => (document.getElementById(`submit-word-${n}`).value || "").trim());
  let category = (document.getElementById("submit-category").value || "").trim();

  if (words.some((w) => !w) || !category) {
    submitGroupMessage.innerText = "All four words and a category are required.";
    return;
  }

  isSubmitting = true;
  submitGroupButton.disabled = true;
  try {
    // No explicit Content-Type header — "application/json" isn't a
    // CORS-safelisted value, so setting it forces a preflight OPTIONS
    // request the backend has no route for (every route here is POST-only,
    // specifically to stay preflight-free — see lambda_function.py). Left
    // unset, fetch defaults to "text/plain;charset=UTF-8" for a string
    // body, which *is* safelisted, and the backend's parse_body() doesn't
    // care what Content-Type says anyway — it just checks whether the body
    // string starts with "{".
    let response = await fetch(`${API_HOST}/submit-group`, {
      method: "POST",
      body: JSON.stringify({ words, category }),
    });
    let body = await response.json();
    if (response.ok) {
      submitGroupMessage.innerText = "Thanks! Your group has been submitted for review.";
      submitGroupForm.reset();
    } else {
      submitGroupMessage.innerText = body.message || "Something went wrong, please try again.";
    }
  } catch (e) {
    submitGroupMessage.innerText = "Something went wrong, please try again.";
  } finally {
    isSubmitting = false;
    submitGroupButton.disabled = false;
  }
}
submitGroupForm.addEventListener("submit", submitGroupCallback);
</script>
</body>
</html>
