<!DOCTYPE html>
<html prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fourplay</title>
    <link rel="icon" type="image/png" href="assets/icons/kaios_112.png" />
    <meta name="description" content="A daily word puzzle -- find the four hidden groups of four. A new Fourplay puzzle every day." />
    <!-- Open Graph / Twitter Card -- see s3/blog/template.html for each
         post's per-date equivalent. og:image needs an absolute URL per the
         spec (unlike this file's other, relative asset paths). The banner
         itself (s3/img/og-banner.png) is deliberately NOT in frontend/img/
         -- it has no reason to ship inside the KaiOS app bundle, so it's
         checked in directly under s3/img/ instead; see s3/release.sh's own
         comment for how that survives its otherwise-full img/ refresh. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fourplay" />
    <meta property="og:title" content="Fourplay -- Find the Four Groups of Four" />
    <meta property="og:description" content="A daily word puzzle -- find the four hidden groups of four. A new Fourplay puzzle every day." />
    <meta property="og:url" content="https://fourplay.elliscode.com/" />
    <meta property="og:image" content="https://fourplay.elliscode.com/img/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="650" />
    <meta property="og:image:alt" content="Fourplay -- a daily word puzzle" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fourplay -- Find the Four Groups of Four" />
    <meta name="twitter:description" content="A daily word puzzle -- find the four hidden groups of four. A new Fourplay puzzle every day." />
    <meta name="twitter:image" content="https://fourplay.elliscode.com/img/og-banner.png" />
    <link rel="stylesheet" href="css/stylesheet.css?v=3.0.15" />
  </head>
  <body>
    <div id="results" class="panel">
      <div id="results-content" nav-selectable="true">
        <p id="display-text">TEXT</p>
        <div id="result-blocks"></div>
        <p id="date-text">0000-00-00</p>
        <!-- Purely a visual/mouse-click affordance — #results-content itself
             is the real D-pad/screen-reader target and already shares on
             click, this button's click just bubbles up to that same
             listener. Hidden at KaiOS width, where the softkey bar's
             center label already says "Share". -->
        <button type="button" class="share-hint" tabindex="-1" aria-hidden="true">Share</button>
      </div>
    </div>

    <div id="comment"><span id="comment-span"></span></div>

    <div class="panel" id="content">
      <div id="header">
        <h1>Fourplay</h1>
        <div id="date-picker-row">
          <div class="input-wrap" id="wrap-date-picker" nav-selectable="true">
            <input onchange="setDate(event)" id="date-picker" type="date" />
          </div>
        </div>
        <p class="tagline">Find the four groups of four.</p>
      </div>

      <div class="game-div">
        <!-- Static placeholder tiles, painted before puzzle.js even runs --
             showPuzzleSkeleton() in puzzle.js leaves these alone if they're
             already here and only generates its own once these are gone
             (removePuzzleSkeleton() clears them the instant the real
             puzzle's fetched, same as it does its own JS-built ones). -->
        <div id="puzzle">
          <div id="answers"></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
          <div class="skeleton-tile"><div></div></div>
        </div>

        <div id="guesses"><span>Chances:</span><div id="guess-spot"></div></div>

        <div id="game-controls">
          <button onclick="shuffleTiles(event);">Shuffle</button>
          <button onclick="deselectAll(event);">Deselect All</button>
          <button onclick="checkGuessCallback(event);">Submit</button>
        </div>
      </div>

      <!-- Hidden until gameOver() in puzzle.js reveals it -- href is set
           there too, once the puzzle's actual date is known. -->
      <p id="blog-results-link"><a href="" id="blog-results-anchor" nav-selectable="true">See how you stacked up! &rarr;</a></p>
      <p id="submit-group-link"><a href="https://fourplay.elliscode.com/submit-group.html" id="submit-group-anchor" nav-selectable="true">Have four words that belong together? Submit a group &rarr;</a></p>
      <p id="settings-link"><button type="button" id="settings-anchor" nav-selectable="true">Settings</button></p>
    </div>

    <!-- KaiOS ad banner (KaiAds SDK) — deliberately last, below everything
         else on the page. See puzzle.js's displayAd(). -->
    <div id="ad-container"></div>

    <!-- KaiOS softkey bar — hidden above 240px width, see stylesheet.css -->
    <div id="softkey">
      <label id="sk-left"></label>
      <label id="sk-center"></label>
      <label id="sk-right"></label>
    </div>

    <!-- Settings modal — opened via #settings-anchor above. Not nested
         inside .panel#content so it's unaffected by anything that toggles
         that panel. See puzzle.js's openSettingsModal()/selectables(). -->
    <div id="settings-modal-backdrop">
      <div id="settings-modal">
        <div id="settings-modal-main">
          <h2>Settings</h2>
          <!-- Hard-coded — bump alongside manifest.webmanifest's
               b2g_features.version when releasing. -->
          <p>Version <span id="app-version">3.0.15</span></p>
          <button type="button" nav-selectable="true" id="settings-clear-data">Clear All Data</button>
          <button type="button" nav-selectable="true" id="settings-close">Close</button>
        </div>
        <div id="settings-modal-confirm">
          <p>Are you sure you want to delete all data? This cannot be undone.</p>
          <button type="button" nav-selectable="true" id="settings-confirm-cancel">Cancel</button>
          <button type="button" nav-selectable="true" id="settings-confirm-delete">Delete All Data</button>
        </div>
      </div>
    </div>

    <script src="js/kaiads.v5.min.js"></script>
    <script src="js/puzzle.js?v=3.0.15"></script>
  </body>
</html>
